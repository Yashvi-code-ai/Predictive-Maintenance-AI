name: Python syntax check

on:
  push:
    branches: [main, "chore/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m compileall -q src app.py train_model.py
      - name: Check notebook JSON
        run: python -c "import json; json.load(open('notebooks/predictive_maintenance_workflow.ipynb', encoding='utf-8'))"
